reporter: xcode
strict: true

excluded:
  - .build/
  - .swiftpm/
  - DerivedData/
  - Generated/
  - OmniAct.app/
  - engineer/

disabled_rules:
  - todo
  - file_header
  - switch_case_on_newline

opt_in_rules:
  - collection_alignment
  - closure_end_indentation
  - contains_over_filter_count
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where_over_filter_first
  - implicitly_unwrapped_optional
  - sorted_first_last

line_length:
  warning: 120
  error: 140

function_body_length:
  warning: 40
  error: 100

file_length:
  warning: 200
  error: 400

type_body_length:
  warning: 200
  error: 350

identifier_name:
  min_length: 3
  excluded: [id, x, y, i, z, _]
